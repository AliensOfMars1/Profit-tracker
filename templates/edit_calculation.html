{% extends "base.html" %}

{% block content %}
<h1 class="mb-4" style="color: #ff6b35;">Edit Calculation</h1>
<p style="color: #aaa;">Editing calculation from: <strong style="color: #ff6b35;">{{ calc.created_at.strftime('%B %d, %Y %I:%M %p') }}</strong></p>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('edit_calculation', id=calc.id) }}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="equity" class="form-label">Equity</label>
                    <input type="number" step="0.01" class="form-control" id="equity" name="equity" value="{{ calc.equity }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="total_usdt" class="form-label">Total USDT</label>
                    <input type="number" step="0.01" class="form-control" id="total_usdt" name="total_usdt" value="{{ calc.total_usdt }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="rate" class="form-label">Rate</label>
                    <input type="number" step="0.01" class="form-control" id="rate" name="rate" value="{{ calc.rate }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="ecash" class="form-label">eCash</label>
                    <input type="number" step="0.01" class="form-control" id="ecash" name="ecash" value="{{ calc.ecash }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="hard_cash" class="form-label">Hard Cash</label>
                    <input type="number" step="0.01" class="form-control" id="hard_cash" name="hard_cash" value="{{ calc.hard_cash }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="cashin_commission" class="form-label">Cash-in Commission</label>
                    <input type="number" step="0.01" class="form-control" id="cashin_commission" name="cashin_commission" value="{{ calc.cashin_commission }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="cashout_commission" class="form-label">Cash-out Commission</label>
                    <input type="number" step="0.01" class="form-control" id="cashout_commission" name="cashout_commission" value="{{ calc.cashout_commission }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="foreign_funds" class="form-label">Foreign Funds</label>
                    <input type="number" step="0.01" class="form-control" id="foreign_funds" name="foreign_funds" value="{{ calc.foreign_funds }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="lent_funds" class="form-label">Lent Funds</label>
                    <input type="number" step="0.01" class="form-control" id="lent_funds" name="lent_funds" value="{{ calc.lent_funds }}" required>
                </div>
            </div>
            
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Update Calculation</button>
                <a href="{{ url_for('history') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
